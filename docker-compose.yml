services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-helpdesk}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD en .env}
    volumes:
      - mongo-data:/data/db
    # Descomente para inspeccionar la base con Compass desde el propio servidor
    # ports:
    #   - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      # Por defecto usa el contenedor `mongo`. Para apuntar a MongoDB Atlas u otro servidor,
      # defina MONGO_URI en el archivo .env y esa cadena tendrá prioridad.
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USER:-helpdesk}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin}
      MONGO_DB: ${MONGO_DB:-helpdesk_casma}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?defina FIELD_ENCRYPTION_KEY en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OFFICE_ALLOWED_NETWORKS: ${OFFICE_ALLOWED_NETWORKS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      AI_EMBEDDINGS: ${AI_EMBEDDINGS:-tfidf}
      RUN_SCHEDULER: "true"
    volumes:
      - backend-data:/data

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mongo-data:
  backend-data:
